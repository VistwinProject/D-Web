<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D 區 · 空間投影</title><link rel="stylesheet" href="fonts/fonts.css"><link rel="stylesheet" href="mapping.css"></head>
<body>
<main id="stage" aria-label="四區投影輸出"></main><svg id="guides" aria-label="投影區域輪廓"></svg><div id="handles"></div>
<header id="toolbar" class="editor"><div class="brand"><b>D</b><span>空間投影<small>PROJECTION MAPPING</small></span></div><div class="top-actions"><span id="connection" role="status">等待劇場</span><button id="blackout">黑場</button><button id="present" class="primary">投影 ↗</button></div></header>
<aside id="panel" class="editor" aria-label="投影校正面板">
<div class="section-heading"><span>投影區域</span><small>03 煙霧 ＋ 01 IH</small></div><div id="regions"></div>
<div class="selected-heading"><h1 id="region-name">煙霧 01</h1><label class="switch"><input id="enabled" type="checkbox">顯示</label></div>
<label class="field">畫面內容<select id="content"><option value="smoke">煙霧 · 跟隨 D 區</option><option value="ih">IH 爐 · 既有紅環畫面</option></select></label>
<label id="lineWidth-field" class="field" hidden>IH 線條粗細 <output id="lineWidth-value"></output><input id="lineWidth" type="range" min="0.5" max="3" step="0.05" aria-label="IH 線條粗細"></label>
<div class="segmented"><button id="warp-tab" aria-pressed="true">① 四角對位</button><button id="crop-tab" aria-pressed="false">② 畫面裁切</button></div>
<section id="warp-panel"><p class="help">拖曳畫面上的四個角，貼合實際表面。<br>拖曳區域名稱，可移動整個區域。</p><div class="row"><label><input type="checkbox" id="grid">校正格線</label><button id="reset-corners" class="quiet">重設四角</button></div><p class="micro">選取角點後，方向鍵微調 1 px；Shift 加速。</p></section>
<section id="crop-panel" hidden><canvas id="crop-preview" width="480" height="270" aria-label="影片來源與裁切範圍"></canvas><label class="field">內容比例<select id="aspect"><option value="1.7777777777777777">16 : 9 · 橫向</option><option value="1">1 : 1 · 方形</option><option value="0.5625">9 : 16 · 直向</option><option value="2.3333333333333335">21 : 9 · 寬幅</option><option value="0.6428571428571429">9 : 14 · IH 原始比例</option></select></label><label class="field">縮放 <output id="zoom-value"></output><input id="zoom" type="range" min="1" max="4" step=".01"></label><label class="field">水平取景 <output id="panX-value"></output><input id="panX" type="range" min="0" max="1" step=".005"></label><label class="field">垂直取景 <output id="panY-value"></output><input id="panY" type="range" min="0" max="1" step=".005"></label><button id="reset-crop" class="quiet">重設裁切</button></section>
<details><summary>進階設定</summary><label class="field">亮度 <output id="brightness-value"></output><input id="brightness" type="range" min="0" max="1.5" step=".01"></label><label class="field">渲染寬度<select id="resolution"><option value="640">640 px · 輕量</option><option value="1280">1280 px · 標準</option><option value="1920">1920 px · 高畫質</option></select></label><label><input id="mirror" type="checkbox">水平鏡像</label><div class="row"><button id="back">移到下層</button><button id="front">移到上層</button></div><p class="micro">渲染寬度不會增加原始影片細節。</p></details>
<div class="source-controls"><div class="section-heading"><span>播放來源</span><small>四區共用</small></div><select id="source"><option value="theater">跟隨 D 區劇場</option><option value="demo">本頁預覽 · 不影響雙螢幕</option></select><div id="demo-controls" hidden><div class="row"><button id="play">播放</button><select id="scene"><option value="75">烹飪煙霧</option><option value="89">負壓排煙</option><option value="99">潔淨新風</option><option value="115">關火淨化</option></select></div><input id="timeline" type="range" min="0" max="140.816" step=".05" value="75" aria-label="本頁預覽進度"></div><output id="time">00:00 / 02:21</output></div>
<footer><button id="save-install" class="primary" style="width:100%">儲存為現場設定</button><div class="row"><button id="export">匯出設定</button><button id="import">匯入</button><button id="undo" title="復原 Ctrl / ⌘ Z">復原</button></div><input id="file" type="file" accept="application/json,.json" hidden><p id="save-status" role="status">設定自動儲存於此瀏覽器</p></footer>
</aside><div id="bottom" class="editor"><span><i></i> 黑色區域不顯示內容</span><span>F 校正面板 · P 投影 · B 黑場 · 1–4 選區</span></div>
<script src="show-config.js"></script><script type="module" src="mapping.mjs"></script></body></html>
