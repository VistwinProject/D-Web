<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>D 區 · IH 爐介面示意</title><link rel="stylesheet" href="fonts/fonts.css"><link rel="stylesheet" href="ih-simple.css?v=20260928-red"></head>
<body>
<main id="projection" aria-label="IH 爐介面示意">
 <section id="surface" aria-label="單口 IH 爐示意">
  <div id="calibration" hidden></div>
  <div class="cooktop">
   <header>IH <span>感應爐</span></header>
   <div class="cooking-zone" aria-hidden="true"></div>
   <div class="control-strip"><span class="power-icon" aria-hidden="true">⏻</span><span class="indicator" aria-hidden="true"></span><span id="state-label">關閉</span></div>
  </div>
  <p class="disclaimer">IH 爐介面示意</p>
  <p class="note">展演情境，非建案配備規格</p>
 </section>
</main>
<div id="hint">F 校正 · 雙擊全螢幕</div>
<aside id="controls" hidden aria-label="投影校正"><header><h1>IH 投影校正</h1><button id="close" aria-label="關閉校正">×</button></header><p>僅呈現爐面輪廓與開關狀態，不控制實體設備。</p>
 <label>展示狀態<select id="mode"><option value="theater">跟隨劇場</option><option value="off">關閉示意</option><option value="on">開啟示意</option></select></label>
 <div id="sliders"></div><label><input type="checkbox" id="grid">顯示定位格線</label><label><input type="checkbox" id="mirror">水平鏡像</label>
 <div class="buttons"><button id="fullscreen">全螢幕</button><button id="reset">重設校正</button><button id="copy">複製校正網址</button></div><output id="message"></output><a href="preview.html">雙電視展演</a>
</aside>
