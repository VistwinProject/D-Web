<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>旋轉輸出</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; transform-origin: 0 0; }
  #stage[data-rotate="90"]  { width: 100vh; height: 100vw; transform: translateX(100vw) rotate(90deg); }
  #stage[data-rotate="-90"] { width: 100vh; height: 100vw; transform: translateY(100vh) rotate(-90deg); }
  #stage[data-rotate="180"] { transform: translate(100vw, 100vh) rotate(180deg); }
  #stage iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<div id="stage"><iframe id="out" allow="autoplay; fullscreen"></iframe></div>
<script src="/exhibit/rotate.js"></script>
<script>
// 通用旋轉外框：?key=D-projector&src=/mapping.html?output=1…
// 由各區的同源代理提供（C 8780、D 8781），所以 src 只接受本站路徑。
// 方向用 key 存在 display.json，控制台可即時切換。滑鼠操作（例如投影四角校正）
// 會依旋轉自動換算座標；鍵盤快捷鍵（F 校正、B 黑場…）則把焦點交給 iframe。
// &hide=CSS 選擇器：在內頁隱藏這些元素與游標，例如投影只留 mapping 好的畫面。
// &calib=1（mapping 校正模式）：角點浮到校正面板上面，按 H 暫時收起／叫回面板。
// 投影調整（projection.json，同一個 key）：煙霧區的黑位切除與邊緣羽化，控制台可即時調。
const q = new URLSearchParams(location.search);
const src = q.get('src') || '';
const key = q.get('key') || '';
const frame = document.getElementById('out');
if (src.startsWith('/') && !src.startsWith('//')) frame.src = src;
document.title = `旋轉輸出 · ${key || src}`;
if (key) exhibitRotation(key, document.getElementById('stage'));
// 黑位切除：先 brightness(b) 再 contrast(c)，等於 out = (v - t) / (1 - t)，
// 低於門檻 t 的暗部變純黑、白色維持 1；兩步都不會超出 0–1，所以不會被截斷。
// 只作用在 mapping 的影片畫布（.surface canvas）；IH 是 iframe，不受影響。
const look = { cut: 0, feather: 0 };
function applyLook() {
  const doc = frame.contentDocument;
  if (!doc?.head) return;
  let style = doc.getElementById('exhibit-look');
  if (!style) { style = doc.createElement('style'); style.id = 'exhibit-look'; doc.head.append(style); }
  const t = Math.min(.8, Math.max(0, +look.cut || 0)), f = Math.min(.3, Math.max(0, +look.feather || 0));
  const slope = 1 / (1 - t), c = 1 + 2 * t * slope, b = slope / c, edge = (f * 100).toFixed(1);
  const fade = dir => `linear-gradient(${dir}, transparent, #000 ${edge}%, #000 ${100 - edge}%, transparent)`;
  const mask = f > 0 ? `${fade('to right')}, ${fade('to bottom')}` : 'none';
  style.textContent = `.surface canvas{filter:${t > 0 ? `brightness(${b.toFixed(4)}) contrast(${c.toFixed(4)})` : 'none'};` +
    `-webkit-mask-image:${mask};mask-image:${mask};-webkit-mask-composite:source-in;mask-composite:intersect}`;
}
if (key) {
  fetch('/exhibit-api/projection', { cache: 'no-store' }).then(r => r.json())
    .then(d => { Object.assign(look, d[key] || {}); applyLook(); }).catch(() => {});
  (function listen() {
    const ws = new WebSocket(`ws://${location.hostname}:8787`);
    ws.onmessage = e => {
      let m;
      try { m = JSON.parse(e.data); } catch { return; }
      if (m.t === 'projection' && m.key === key) { look.cut = m.cut; look.feather = m.feather; applyLook(); }
      // 遠端按下 mapping 自己的「儲存為現場設定」（走原本的驗證與存檔流程），回報結果
      if (m.t === 'mapping-save' && m.key === key) {
        const doc = frame.contentDocument, button = doc?.getElementById('save-install');
        const report = text => ws.send(JSON.stringify({ t: 'mapping-save-result', key, status: text }));
        if (!button) return report('這個畫面沒有 mapping 校正面板');
        button.click();
        setTimeout(() => report(doc.getElementById('save-status')?.textContent || ''), 2500);
      }
    };
    ws.onclose = () => setTimeout(listen, 3000);
  })();
}

frame.addEventListener('load', () => {
  applyLook();
  const hide = q.get('hide');
  if (hide) {
    const style = frame.contentDocument.createElement('style');
    style.textContent = `${hide}{display:none!important} html,body,*{cursor:none!important}`;
    frame.contentDocument.head.append(style);
  }
  if (q.get('calib') === '1') {
    const doc = frame.contentDocument, win = frame.contentWindow;
    const style = doc.createElement('style');
    style.textContent = '#handles{z-index:30!important} body.exhibit-nopanel #panel{display:none!important}';
    doc.head.append(style);
    win.addEventListener('keydown', e => {
      if (e.key.toLowerCase() !== 'h' || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
      doc.body.classList.toggle('exhibit-nopanel');
    });
  }
  frame.contentWindow.focus();
});
addEventListener('focus', () => frame.contentWindow?.focus());
</script>
<script src="/exhibit/exit-menu.js"></script>
</body>
</html>
